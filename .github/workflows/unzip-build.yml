name: LinOx - Unzip and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          set -e

          if [ ! -f "LinOx_0.5.4_ROOTFS_osrelease_fix.zip" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "LinOx_0.5.4_ROOTFS_osrelease_fix.zip"

      - name: Extract LinOx ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "LinOx_0.5.4_ROOTFS_osrelease_fix.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 2 -type f | head -50

      - name: Prepare Android project
        run: |
          set -e

          PROJECT="extracted/LinuxAndroid-main"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found!"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          echo "Android project:"
          ls -la "$PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: extracted/LinuxAndroid-main
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: extracted/LinuxAndroid-main
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "APK files:"
          find extracted/LinuxAndroid-main/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-debug
          path: extracted/LinuxAndroid-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
