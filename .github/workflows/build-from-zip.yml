name: Build LinOx APK from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "**/*.zip"
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "::error::No project ZIP file was found in the repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/_build"
          mkdir -p "$GITHUB_WORKSPACE/_build"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_build"

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/_build" \
            -type f -name 'settings.gradle.kts' \
            -print -quit | xargs -r dirname)"

          if [ -z "${PROJECT_DIR:-}" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/_build" \
              -type f -name 'settings.gradle' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The ZIP does not contain a valid Android Gradle project."
            echo "Expected settings.gradle(.kts) and app/build.gradle(.kts)."
            find "$GITHUB_WORKSPACE/_build" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -print -quit)"

          if [ -z "${APK:-}" ]; then
            echo "::error::APK was not generated."
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-debug-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
