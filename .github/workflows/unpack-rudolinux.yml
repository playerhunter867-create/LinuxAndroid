name: Unpack RudoLinux ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          ZIP_NAME="$(basename "$ZIP")"

          echo "Found: $ZIP_NAME"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf _extracted
          mkdir -p _extracted

          unzip -q "${{ steps.zip.outputs.zip }}" -d _extracted

          echo "ZIP extracted:"
          find _extracted -maxdepth 3 -type f | sort

      - name: Detect project directory
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find _extracted -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found!"
            echo "The ZIP does not contain a valid Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf _project
          mkdir -p _project

          PROJECT_DIR="${{ steps.project
