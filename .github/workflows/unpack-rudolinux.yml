name: Unpack RudoLinux ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found."
            exit 1
          fi

          echo "ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.unpack"
          mkdir -p "$GITHUB_WORKSPACE/.unpack"

          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/.unpack"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE/.unpack" \
            -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find "$GITHUB_WORKSPACE/.unpack" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.project"
          mkdir -p "$GITHUB_WORKSPACE/.project"

          tar -C "$PROJECT_DIR" -cf - . \
            | tar -C "$GITHUB_WORKSPACE/.project" -xf -

          # IMPORTANT:
          # Never copy workflows from the ZIP.
          rm -rf "$GITHUB_WORKSPACE/.project/.github/workflows"

          # Also remove any nested .github directory left by the ZIP.
          rm -rf "$GITHUB_WORKSPACE/.project/.github"

      - name: Clean repository
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".project" \
            ! -name ".unpack" \
            -exec rm -rf {} +

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail

          tar -C "$GITHUB_WORKSPACE/.project" -cf - . \
            | tar -C "$GITHUB_WORKSPACE" -xf -

          rm -rf "$GITHUB_WORKSPACE/.project"
          rm -rf "$GITHUB_WORKSPACE/.unpack"
          rm -f "$ZIP_PATH"

      - name: Restore unpack workflow
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"

          cat > "$GITHUB_WORKSPACE/.github/workflows/unpack-rudolinux.yml" <<'EOF'
name: Unpack RudoLinux ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ZIP not found."
            exit 1
          fi
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract
        run: |
          rm -rf .unpack
          mkdir .unpack
          unzip -q "$ZIP_PATH" -d .unpack

      - name: Find project
        run: |
          SETTINGS="$(find .unpack -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Install
        run: |
          rm -rf .project
          mkdir .project

          tar -C "$PROJECT_DIR" -cf - . \
            | tar -C .project -xf -

          rm -rf .project/.github

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".project" \
            ! -name ".unpack" \
            -exec rm -rf {} +

          tar -C .project -cf - . \
            | tar -C . -xf -

          rm -rf .project .unpack
          rm -f "$ZIP_PATH"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Unpack RudoLinux project"
          git push
EOF

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/app"
          test -f "$GITHUB_WORKSPACE/settings.gradle.kts"

          # CRITICAL:
          # build.yml must NOT come from the ZIP.
          if [ -f "$GITHUB_WORKSPACE/.github/workflows/build.yml" ]; then
            echo "ERROR: build.yml was copied from ZIP."
            rm -f "$GITHUB_WORKSPACE/.github/workflows/build.yml"
          fi

          echo "RudoLinux project is ready."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Unpack RudoLinux project"
          git push
