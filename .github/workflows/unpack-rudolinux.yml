name: Unpack RudoLinux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf /tmp/rudolinux
          mkdir -p /tmp/rudolinux

          unzip -q "$ZIP" -d /tmp/rudolinux

          echo "ZIP extracted"

      - name: Find project
        run: |
          set -e

          SETTINGS=$(find /tmp/rudolinux -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT"

      - name: Copy Android project
        run: |
          set -e

          # Удаляем только старые Android-файлы.
          rm -rf app
          rm -rf gradle
          rm -f build.gradle.kts
          rm -f build.gradle
          rm -f settings.gradle.kts
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          # Копируем проект.
          cp -r "$PROJECT/app" ./app

          [ -d "$PROJECT/gradle" ] && cp -r "$PROJECT/gradle" ./gradle || true

          [ -f "$PROJECT/build.gradle.kts" ] && cp "$PROJECT/build.gradle.kts" .
          [ -f "$PROJECT/build.gradle" ] && cp "$PROJECT/build.gradle" .
          [ -f "$PROJECT/settings.gradle.kts" ] && cp "$PROJECT/settings.gradle.kts" .
          [ -f "$PROJECT/settings.gradle" ] && cp "$PROJECT/settings.gradle" .
          [ -f "$PROJECT/gradle.properties" ] && cp "$PROJECT/gradle.properties" .
          [ -f "$PROJECT/gradlew" ] && cp "$PROJECT/gradlew" .
          [ -f "$PROJECT/gradlew.bat" ] && cp "$PROJECT/gradlew.bat" .

          echo "Android project copied"

      - name: Remove ZIP
        run: |
          rm -f "$ZIP"

      - name: Verify
        run: |
          set -e

          echo "Checking project..."

          test -d app

          if [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts OK"
          elif [ -f settings.gradle ]; then
            echo "settings.gradle OK"
          else
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          test -f app/build.gradle.kts || test -f app/build.gradle

          echo ""
          echo "RudoLinux:"
          find app -maxdepth 5 -type f | sort

      - name: Commit Android project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app
          git add gradle
          git add build.gradle.kts build.gradle
          git add settings.gradle.kts settings.gradle
          git add gradle.properties
          git add gradlew gradlew.bat
          git add -u

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Install RudoLinux Android project"

          git push
