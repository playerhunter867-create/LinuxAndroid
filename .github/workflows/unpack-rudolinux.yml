name: Unpack RudoLinux ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.unpack"
          mkdir -p "$GITHUB_WORKSPACE/.unpack"

          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/.unpack"

      - name: Find project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE/.unpack" \
            -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.project"
          mkdir -p "$GITHUB_WORKSPACE/.project"

          tar -C "$PROJECT_DIR" -cf - . \
            | tar -C "$GITHUB_WORKSPACE/.project" -xf -

      - name: Clean repository
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="$(basename "$ZIP_PATH")"

          find "$GITHUB_WORKSPACE" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".project" \
            ! -name ".unpack" \
            ! -name "$ZIP_NAME" \
            -exec rm -rf {} +

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail

          tar -C "$GITHUB_WORKSPACE/.project" -cf - . \
            | tar -C "$GITHUB_WORKSPACE" -xf -

          rm -rf "$GITHUB_WORKSPACE/.project"
          rm -rf "$GITHUB_WORKSPACE/.unpack"
          rm -f "$ZIP_PATH"

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/app"

          if [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            echo "settings.gradle.kts OK"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            echo "settings.gradle OK"
          else
            echo "ERROR: Gradle settings missing."
            exit 1
          fi

          echo "RudoLinux project installed successfully."

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Unpack RudoLinux project"
          git push
