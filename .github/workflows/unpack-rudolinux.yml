name: Unpack RudoLinux ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.unpack"
          mkdir -p "$GITHUB_WORKSPACE/.unpack"

          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/.unpack"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/.unpack" -maxdepth 5 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE/.unpack" -type f \(             -name 'settings.gradle.kts' -o             -name 'settings.gradle'           \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not find settings.gradle.kts or settings.gradle."
            echo "ZIP contents:"
            find "$GITHUB_WORKSPACE/.unpack" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.project"
          mkdir -p "$GITHUB_WORKSPACE/.project"

          # tar correctly copies ALL files, including hidden files.
          tar -C "$PROJECT_DIR" -cf - . | tar -C "$GITHUB_WORKSPACE/.project" -xf -

          echo "Prepared project:"
          find "$GITHUB_WORKSPACE/.project" -maxdepth 5 -type f | sort

      - name: Remove old repository contents
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".unpack"             ! -name ".project"             ! -name "$(basename "$ZIP_PATH")"             -exec rm -rf {} +

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail

          # Copy ALL files, including .github.
          tar -C "$GITHUB_WORKSPACE/.project" -cf - . |             tar -C "$GITHUB_WORKSPACE" -xf -

          rm -rf "$GITHUB_WORKSPACE/.project"
          rm -rf "$GITHUB_WORKSPACE/.unpack"
          rm -f "$ZIP_PATH"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$GITHUB_WORKSPACE/app" ]; then
            echo "ERROR: app/ directory was not installed."
            exit 1
          fi

          if [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          echo
          echo "===== RudoLinux installed successfully ====="
          echo
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f             ! -path "$GITHUB_WORKSPACE/.git/*" | sort

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Unpack RudoLinux project"
          git push
