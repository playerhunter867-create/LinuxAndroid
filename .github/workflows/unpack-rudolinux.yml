name: Unpack RudoLinux ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Extract ZIP and commit project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi
          echo "ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_PATH" -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project was not found."
            echo "Expected settings.gradle.kts or settings.gradle inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy project
        shell: bash
        run: |
          set -e

          rm -rf project_to_copy
          mkdir project_to_copy

          cp -a "$PROJECT_DIR"/. project_to_copy/

          echo "Project prepared:"
          find project_to_copy -maxdepth 5 -type f | sort

      - name: Clean repository
        shell: bash
        run: |
          set -e

          ZIP_NAME="$(basename "$ZIP_PATH")"

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name "$ZIP_NAME"             -exec rm -rf {} +

      - name: Install project
        shell: bash
        run: |
          set -e

          cp -a project_to_copy/. .

          rm -rf project_to_copy
          rm -rf extracted
          rm -f "$ZIP_PATH"

      - name: Verify
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts || test -f settings.gradle
          test -d app

          echo "SUCCESS!"
          echo
          echo "Repository:"
          find . -maxdepth 4 -type f             ! -path "./.git/*" | sort

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Unpack RudoLinux project"
          git push
