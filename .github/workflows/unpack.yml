name: Unpack ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf _unpack
          mkdir -p _unpack

          unzip -o "$ZIP_PATH" -d _unpack

          echo "ZIP extracted."

      - name: Copy project files
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          ITEMS=(_unpack/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE="${ITEMS[0]}"
          else
            SOURCE="_unpack"
          fi

          echo "Copy source: $SOURCE"

          # Сначала сохраняем текущие GitHub Actions
          rm -rf _workflow_backup
          mkdir -p _workflow_backup

          if [ -d ".github/workflows" ]; then
            cp -a .github/workflows/. _workflow_backup/
          fi

          # Копируем ZIP поверх репозитория
          cp -a "$SOURCE"/. .

          # Возвращаем существующие workflows
          rm -rf .github/workflows
          mkdir -p .github/workflows

          if [ -d "_workflow_backup" ]; then
            cp -a _workflow_backup/. .github/workflows/
          fi

          rm -rf _workflow_backup
          rm -rf _unpack

      - name: Remove ZIP
        shell: bash
        run: |
          find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            -delete

      - name: Protect workflows
        shell: bash
        run: |
          # Дополнительная защита:
          # workflow-файлы не должны попасть в commit этого запуска.

          git restore --source=HEAD -- .github/workflows 2>/dev/null || true

      - name: Show changes
        run: |
          echo "===== CHANGED FILES ====="
          git status --short

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack ZIP into repository"

      - name: Push changes
        shell: bash
        run: |
          set -e

          git push origin HEAD:main
