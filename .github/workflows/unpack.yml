      - name: Unpack ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir -p _unpack
          unzip -o "$ZIP" -d _unpack

          shopt -s dotglob nullglob
          ITEMS=(_unpack/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            INNER="${ITEMS[0]}"
            cp -a "$INNER"/. .
          else
            cp -a _unpack/. .
          fi

          # НЕ разрешаем ZIP менять GitHub Actions
          git checkout -- .github/workflows 2>/dev/null || true

          rm -rf _unpack
