name: Build LinOx APK from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Gradle version"
          echo "========================================"

          which gradle
          gradle --version

          VERSION="$(gradle --version | grep '^Gradle ' | awk '{print $2}')"

          echo "Detected Gradle: $VERSION"

          if [ "$VERSION" != "8.10.2" ]; then
            echo "::error::Wrong Gradle version: $VERSION"
            echo "::error::Expected Gradle 8.10.2"
            exit 1
          fi

          echo "Gradle 8.10.2 is active."

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for project ZIP"
          echo "========================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -not -path "./.github/*" \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP was found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/_build"
          mkdir -p "$GITHUB_WORKSPACE/_build"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_build"

          echo "========================================"
          echo "ZIP extracted"
          echo "========================================"

          find "$GITHUB_WORKSPACE/_build" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Locating Android Gradle project"
          echo "========================================"

          PROJECT_DIR=""

          SETTINGS_KTS="$(
            find "$GITHUB_WORKSPACE/_build" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1
          )"

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_KTS")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_GRADLE="$(
              find "$GITHUB_WORKSPACE/_build" \
                -type f \
                -name "settings.gradle" \
                -print \
                | head -n 1
            )"

            if [ -n "$SETTINGS_GRADLE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_GRADLE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Found Android project."
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Found Android project."
          else
            echo "::error::Android app module was not found."
            echo "Project directory:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"
          echo "========================================"

      - name: Prepare Gradle wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Gradle"
          echo "========================================"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING LIN OX DEBUG APK"
          echo "========================================"

          rm -rf app/build

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "========================================"
          echo "BUILD FINISHED"
          echo "========================================"

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for generated APK"
          echo "========================================"

          APK=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK="$file"
              break
            fi
          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk/debug" \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."

            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-debug-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
