name: Build LinOx APK from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "**/*.zip"
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort | head -300

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            | sort \
            | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "::error::No project ZIP file was found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/_build"
          mkdir -p "$GITHUB_WORKSPACE/_build"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_build"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/_build" -maxdepth 5 -type f | sort | head -300

          PROJECT_DIR=""

          SETTINGS_KTS="$(find "$GITHUB_WORKSPACE/_build" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -n "${SETTINGS_KTS:-}" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_KTS")"
          fi

          if [ -z "${PROJECT_DIR:-}" ]; then
            SETTINGS_GRADLE="$(find "$GITHUB_WORKSPACE/_build" \
              -type f \
              -name 'settings.gradle' \
              -print -quit)"

            if [ -n "${SETTINGS_GRADLE:-}" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_GRADLE")"
            fi
          fi

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
             && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module was not found."
            echo "PROJECT_DIR=$PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Android project:"
          echo "$PROJECT_DIR"
          echo "================================"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify actual Gradle version
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Gradle executable ==="
          which gradle

          echo "=== Gradle version ==="
          gradle --version

          VERSION="$(gradle --version | grep '^Gradle ' | awk '{print $2}')"

          echo "Detected Gradle version: $VERSION"

          if [ "$VERSION" != "8.10.2" ]; then
            echo "::error::Wrong Gradle version detected!"
            echo "Expected: 8.10.2"
            echo "Actual: $VERSION"
            exit 1
          fi

          echo "Gradle 8.10.2 is correctly active."

      - name: Clean old build directory
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          rm -rf build
          rm -rf app/build

          echo "Old build files removed."

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "BUILDING LIN OX DEBUG APK"
          echo "================================"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching for APK ==="

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "::error::APK was not generated."

            echo "=== Build output ==="
            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APK" ]; then
            echo "::error::APK file does not exist."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE
